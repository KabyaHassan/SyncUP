<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h2 class="text-xl font-semibold text-gray-800 dark:text-gray-100">Course Management</h2>
        <button id="add-course-btn" onclick="document.getElementById('add-course-modal').classList.remove('hidden')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center">
            <i data-lucide="plus" class="w-4 h-4 mr-2"></i> Add Course
        </button>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-900/50 dark:text-gray-400">
                    <tr>
                        <th class="px-6 py-3">Course Code</th>
                        <th class="px-6 py-3">Course Name</th>
                        <th class="px-6 py-3 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="course-list" class="divide-y divide-gray-200 dark:divide-gray-700">
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="add-course-modal" class="fixed inset-0 bg-gray-900/50 dark:bg-gray-900/80 hidden flex items-center justify-center z-50">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl w-full max-w-md overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Add New Course</h3>
            <button onclick="document.getElementById('add-course-modal').classList.add('hidden')" class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <form onsubmit="handleFormSubmit(event, '/api/course/create.php', () => { document.getElementById('add-course-modal').classList.add('hidden'); loadCourses(); })" class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Course Code</label>
                <input type="text" name="course_code" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Course Name</label>
                <input type="text" name="course_name" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
            </div>
            <div class="pt-4 flex justify-end gap-3">
                <button type="button" onclick="document.getElementById('add-course-modal').classList.add('hidden')" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 dark:bg-gray-800 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-700 transition-colors">Cancel</button>
                <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-lg hover:bg-blue-700 transition-colors">Save Course</button>
            </div>
        </form>
    </div>
</div>

<script>
async function loadCourses() {
    const list = document.getElementById('course-list');
    list.innerHTML = '<tr><td colspan="3" class="px-6 py-8 text-center text-gray-500"><i data-lucide="loader-2" class="animate-spin w-6 h-6 mx-auto"></i></td></tr>';
    lucide.createIcons();

    const data = await apiCall('/api/course/read.php');
    
    if (data.success) {
        const isAdmin = currentUser && currentUser.role === 'Admin';
        
        const addBtn = document.getElementById('add-course-btn');
        if (addBtn && currentUser) {
            addBtn.classList.remove('hidden');
        }

        list.innerHTML = data.data.map(c => `
            <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">
                <td class="px-6 py-4 font-medium text-gray-900 dark:text-white">${c.course_code}</td>
                <td class="px-6 py-4 text-gray-900 dark:text-gray-100">${c.course_name}</td>
                <td class="px-6 py-4 text-right space-x-2">
                    ${isAdmin ? `
                        <button onclick="promptUpdateCourse('${c.course_code}')" class="text-blue-600 hover:text-blue-800 dark:text-blue-400 dark:hover:text-blue-300"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        <button onclick="deleteCourse('${c.course_code}')" class="text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-300"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    ` : '<span class="text-gray-400 italic text-xs">View Only</span>'}
                </td>
            </tr>
        `).join('') || '<tr><td colspan="3" class="px-6 py-4 text-center text-gray-500">No courses found</td></tr>';
        lucide.createIcons();
    } else {
        showToast(data.message, 'error');
        list.innerHTML = '<tr><td colspan="3" class="px-6 py-4 text-center text-red-500">Error loading data</td></tr>';
    }
}

async function promptUpdateCourse(code) {
    const newName = await customPrompt("Enter new course name:");
    if (!newName) return;

    const formData = new FormData();
    formData.append('course_code', code);
    formData.append('course_name', newName);

    const data = await apiCall('/api/course/update.php', { method: 'POST', body: formData });
    if (data.success) {
        showToast(data.message, 'success'); loadCourses();
    } else {
        showToast(data.message, 'error');
    }
}

async function deleteCourse(code) {
    if (!await customConfirm('Are you sure you want to delete this course?')) return;
    const formData = new FormData();
    formData.append('course_code', code);
    const data = await apiCall('/api/course/delete.php', { method: 'POST', body: formData });
    if (data.success) {
        showToast(data.message, 'success'); loadCourses();
    } else {
        showToast(data.message, 'error');
    }
}

loadCourses();
</script>
